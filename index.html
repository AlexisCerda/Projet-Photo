<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>index td8 : fetch</title>
  <link rel="stylesheet" href="css/index.css">
</head>

<body>
  <section id="photo"></section>

  <script id="template1" type="text/x-handlebars-template">
    <div class="photo-item" id="photo-{{photo.id}}">
      <h4>{{photo.titre}}</h4>
      <img src="{{photo.url.href}}" alt="{{photo.titre}}" width="{{photo.width}}" height="{{photo.height}}">
      <p><strong>Description :</strong> {{photo.descr}}</p>
      <p><strong>Format :</strong> {{photo.format}}</p>
      <p><strong>Taille :</strong> {{photo.size}} px</p>
      
      <div class="categorie-section">
        <h5>Catégorie :</h5>
        {{#if categorie}}
          <p><strong>{{categorie.titre}}</strong></p>
          <p>{{categorie.descr}}</p>
        {{else}}
          <a href="{{links}}">Voir la catégorie</a>
        {{/if}}
      </div>
      
      <div class="comments-section">
        <h5>Commentaires ({{comments.length}}) :</h5>
        <ul>
          {{#each comments}}
            <li>
              <strong>{{titre}}</strong> de <em>{{pseudo}}</em> le <span>{{created_at}}</span>
              <p>{{content}}</p>
            </li>
          {{else}}
            <li>Aucun commentaire pour cette photo.</li>
          {{/each}}
        </ul>
      </div>
    </div>
  </script>

  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
  <script src='dist/index.js' defer></script>
</body>

</html>
