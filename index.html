<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>index td8 : fetch</title>
  <link rel="stylesheet" href="css/index.css">
</head>

<body>
  <section id="photo"></section>

  <script id="template1" type="text/x-handlebars-template">
    <div class="photo-item" id="photo-{{id}}">
      <h4>{{titre}}</h4>
      <img src="{{url}}" alt="{{titre}}" width="{{width}}" height="{{height}}">
      <p><strong>Description :</strong> {{descr}}</p>
      <p><strong>Catégorie :</strong> {{categorie}}</p>
      <p><strong>Format :</strong> {{format}}</p>
      <p><strong>Taille :</strong> {{size}} px</p>
      <p><strong>Commentaires :</strong> {{comments}}</p>
      <a href="{{links}}">Plus d'infos</a>
    </div>
  </script>

  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
  <script src='js/index.js' defer></script>
</body>

</html>
