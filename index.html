<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <title>Photo TD8</title>
  <link rel="stylesheet" href="css/index.css">
</head>

<body>

  <main id="app">
    <header class="page-header">
      <h1>Galerie photo</h1>
    </header>
<button id="Fload-gallery" type="button">First</button>
  <button id="Pload-gallery" type="button">Previous</button>
  <button id="load-gallery" type="button">Load</button>
  <button id="Nload-gallery" type="button">Next</button>
  <button id="Lload-gallery" type="button">Last</button>
    <section id="gallery" aria-live="polite"></section>
  </main>

  <div id="lightbox" class="hidden">

  <button id="close" class="lb-btn lb-close">✕</button>
  <button id="prev" class="lb-btn lb-prev">‹</button>

  <div class="lb-stage">
    <img id="lightbox-img">
    <div id="lb-loader" class="hidden"></div>
    <h1 id="lb-title"></h1>
  </div>

  <button id="next" class="lb-btn lb-next">›</button>

</div>

</div>

  <script src="dist/index.js" defer></script>

</body>

</html>
