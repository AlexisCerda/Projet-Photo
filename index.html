<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <title>Photo TD8</title>
  <link rel="stylesheet" href="css/index.css">
</head>

<body>

  <main id="app">
    <header class="page-header">
      <h1>Galerie photo</h1>
    </header>
<button id="Fload-gallery" type="button">First</button>
  <button id="Pload-gallery" type="button">Previous</button>
  <button id="load-gallery" type="button">Load</button>
  <button id="Nload-gallery" type="button">Next</button>
  <button id="Lload-gallery" type="button">Last</button>
    <section id="gallery" aria-live="polite"></section>
  </main>


  <main id="photo"></main>
  

  <script id="photoTemplate" type="text/x-handlebars-template">
    <h1>Photo : {{id}}</h1>
    <section id="la_photo">
      <img src="{{url}}" alt="{{titre}}">
      <h4>{{titre}}</h4>
      <p>{{descr}}</p>
      <p>{{format}}, {{width}} x {{height}}</p>
      <h4 id="la_categorie">
        Catégorie :
        {{categorie.nom}}
      </h4>
      <p>{{categorie.descr}}</p>

      <h4>Commentaires :</h4>

      <ul id="les_commentaires">
        {{#each comments}}
          <li>
            <strong>{{pseudo}}</strong> :
            {{content}}
          </li>
        {{else}}
          <li>Aucun commentaire</li>
        {{/each}}
      </ul>
    </section>
  </script>
  <script src="https://unpkg.com/handlebars@latest/dist/handlebars.min.js"></script>


  <script src="dist/index.js" defer></script>

</body>

</html>
