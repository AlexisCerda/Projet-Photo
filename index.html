<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>index td8 : fetch</title>
  <link rel="stylesheet" href="css/index.css">
</head>

<body>
  <section id="photo"></section>

  <script id="template1" type="text/x-handlebars-template">
    <div class="photo-item" id="photo-{{photo.id}}">
      <h4>{{titre}}</h4>
      <img src="{{url}}" alt="{{titre}}" width="{{width}}" height="{{height}}">
      <p><strong>Description :</strong> {{descr}}</p>
      <p><strong>Format :</strong> {{format}}</p>
      <p><strong>Taille :</strong> {{size}} px</p>
      
      <div class="categorie-section">
        <h5>Catégorie :</h5>
        <li>
          <p><strong>{{categorie.nom}}</strong></p>
           <p>{{categorie.descr}}</p>
        </li>
      </div>
      
      <div class="comments-section">
        <h5>Commentaires ({{comments.length}}) :</h5>
        <ul>
          {{#each comments}}
            <li>
              <strong>{{titre}}</strong> de <em>{{pseudo}}</em> le <span>{{created_at}}</span>
              <p>{{content}}</p>
            </li>
          {{else}}
            <li>Aucun commentaire pour cette photo.</li>
          {{/each}}
        </ul>
      </div>
    </div>
  </script>

  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
  <script src='dist/index.js' defer></script>
</body>

</html>
